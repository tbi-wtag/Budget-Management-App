[project]
name = "backend"
version = "0.1.0"
description = "Budget Management System"
readme = "README.md"
authors = [
    { name = "tbi-wtag", email = "tejal.bissessur@welldev.io" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
