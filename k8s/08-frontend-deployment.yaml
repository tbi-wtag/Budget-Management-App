apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-frontend
  namespace: budget-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-frontend
  template:
    metadata:
      labels:
        app: budget-frontend
    spec:
      containers:
        - name: frontend
          image: tejalb29/budget-frontend:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"